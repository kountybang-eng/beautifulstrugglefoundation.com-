<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSF | Staff Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --gold: #FFD700; --green: #39FF14; --bg: #050505; --card: #111; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }

        /* Login Form */
        #login-section { text-align: center; margin-top: 100px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border-radius: 8px; font-weight: 900; cursor: pointer; border: none; margin-top: 10px; }
        .btn-gold { background: var(--gold); color: black; }

        /* Internal Dashboard */
        #admin-content { display: none; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .staff-card { background: var(--card); border: 1px solid #333; border-radius: 12px; padding: 20px; height: 400px; display: flex; flex-direction: column; }
        .scroll-area { flex-grow: 1; overflow-y: auto; margin: 15px 0; border-top: 1px solid #222; padding-top: 10px; }

        .chat-msg { background: #181818; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
        .chat-user { color: var(--gold); font-weight: 700; margin-right: 5px; }

        .todo-item { display: flex; align-items: center; background: #181818; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
        .todo-item input[type="checkbox"] { width: auto; margin-right: 10px; }

        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); padding-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGIN SECTION -->
        <div id="login-section">
            <h1 style="color: var(--gold);">STAFF LOGIN</h1>
            <p style="color: #888;">Authorized Personnel Only</p>
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Password">
            <button class="btn btn-gold" onclick="handleLogin()">ENTER PORTAL</button>
        </div>

        <!-- INTERNAL CONTENT -->
        <div id="admin-content">
            <div class="header">
                <h2>STAFF HUB</h2>
                <button onclick="handleLogout()" style="background: transparent; color: #ff4444; border: none; cursor: pointer;">LOGOUT</button>
            </div>

            <div class="dashboard-grid">
                <!-- CONVO BOARD -->
                <div class="staff-card">
                    <h3 style="color: var(--green);">CONVO BOARD</h3>
                    <div id="chat-list" class="scroll-area"></div>
                    <div style="display: flex; gap: 5px;">
                        <input type="text" id="chat-input" placeholder="Type a message...">
                        <button class="btn-gold" style="padding: 0 15px; border-radius: 8px;" onclick="sendMsg()">SEND</button>
                    </div>
                </div>

                <!-- TO-DO BOARD -->
                <div class="staff-card">
                    <h3 style="color: var(--gold);">TO-DO BOARD</h3>
                    <div id="todo-list" class="scroll-area"></div>
                    <div style="display: flex; gap: 5px;">
                        <input type="text" id="todo-input" placeholder="New task...">
                        <button class="btn-gold" style="padding: 0 15px; border-radius: 8px;" onclick="addTodo()">ADD</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://lvddcidqxqofdputxrex.supabase.co';
        const supabaseKey = 'lvddcidqxqofdputxrexsb_publishable_-F-RS0EEc-yR30sB0dRrCg_Ls8jA9AN';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // 1. AUTH LOGIC
        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

            if (error) alert(error.message);
            else checkUser();
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            location.reload();
        }

        async function checkUser() {
            const { data: { user } } = await _supabase.auth.getUser();
            if (user) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                loadChat();
                loadTodos();
            }
        }

        // 2. CONVO BOARD LOGIC
        async function loadChat() {
            const { data } = await _supabase.from('staff_convo').select('*').order('created_at', { ascending: true });
            if (data) {
                const list = document.getElementById('chat-list');
                list.innerHTML = data.map(m => `<div class="chat-msg"><span class="chat-user">${m.sender}:</span>${m.text}</div>`).join('');
                list.scrollTop = list.scrollHeight;
            }
        }

        async function sendMsg() {
            const text = document.getElementById('chat-input').value;
            const { data: { user } } = await _supabase.auth.getUser();
            await _supabase.from('staff_convo').insert([{ text, sender: user.email }]);
            document.getElementById('chat-input').value = '';
            loadChat();
        }

        // 3. TO-DO LOGIC
        async function loadTodos() {
            const { data } = await _supabase.from('staff_tasks').select('*').order('created_at', { ascending: false });
            if (data) {
                document.getElementById('todo-list').innerHTML = data.map(t => `
                    <div class="todo-item">
                        <input type="checkbox" ${t.is_done ? 'checked' : ''} onchange="toggleTodo('${t.id}', this.checked)">
                        <span style="${t.is_done ? 'text-decoration: line-through; color: #555' : ''}">${t.task}</span>
                    </div>
                `).join('');
            }
        }

        async function addTodo() {
            const task = document.getElementById('todo-input').value;
            await _supabase.from('staff_tasks').insert([{ task, is_done: false }]);
            document.getElementById('todo-input').value = '';
            loadTodos();
        }

        async function toggleTodo(id, is_done) {
            await _supabase.from('staff_tasks').update({ is_done }).eq('id', id);
            loadTodos();
        }

        checkUser(); // Check if already logged in on load
    </script>
</body>
</html>
