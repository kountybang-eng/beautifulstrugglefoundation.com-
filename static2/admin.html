<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSF | Staff Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --gold: #FFD700;
            --green: #39FF14;
            --purple: #8B4BA8;
            --bg: #050505;
            --card: #111;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        #login-section {
            text-align: center;
            margin-top: 100px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        #login-section h1 { color: var(--purple); margin-bottom: 10px; }
        #login-section p { color: #888; margin-bottom: 30px; }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: #222;
            border: 2px solid #444;
            color: white;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }

        input:focus { outline: none; border-color: var(--purple); background: #1a1a1a; }
        input::placeholder { color: #666; }

        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
            border: none;
            margin-top: 10px;
            transition: all 0.2s;
            font-size: 16px;
        }

        .btn-gold {
            background: var(--gold);
            color: black;
        }

        .btn-gold:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        #admin-content { display: none; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        @media (max-width: 900px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }

        .staff-card {
            background: var(--card);
            border: 2px solid var(--purple);
            border-radius: 12px;
            padding: 25px;
            height: 500px;
            display: flex;
            flex-direction: column;
        }

        .staff-card h3 { color: var(--purple); margin-bottom: 15px; font-size: 18px; }

        .scroll-area {
            flex-grow: 1;
            overflow-y: auto;
            margin: 15px 0;
            border-top: 1px solid #333;
            padding-top: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }

        .chat-msg, .todo-item {
            background: rgba(139, 75, 168, 0.1);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .chat-user {
            color: var(--gold);
            font-weight: 700;
            margin-right: 5px;
        }

        .todo-item {
            display: flex;
            align-items: center;
        }

        .todo-item input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
            cursor: pointer;
        }

        .scroll-area::-webkit-scrollbar {
            width: 8px;
        }

        .scroll-area::-webkit-scrollbar-track {
            background: rgba(139, 75, 168, 0.1);
            border-radius: 10px;
        }

        .scroll-area::-webkit-scrollbar-thumb {
            background: var(--purple);
            border-radius: 10px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-row input {
            flex: 1;
            margin: 0;
        }

        .input-row button {
            flex: 0 0 auto;
            width: auto;
            padding: 0 20px;
            margin: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--purple);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .header h2 {
            color: var(--purple);
            margin: 0;
        }

        .logout-btn {
            background: transparent;
            color: #ff4444;
            border: 2px solid #ff4444;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: rgba(255, 68, 68, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGIN SECTION -->
        <div id="login-section">
            <h1>🔐 STAFF PORTAL</h1>
            <p>Authorized Personnel Only</p>
            <input type="email" id="email" placeholder="Email Address" autocomplete="email">
            <input type="password" id="password" placeholder="Password" autocomplete="current-password">
            <button class="btn btn-gold" id="login-btn" onclick="handleLogin()">ENTER PORTAL</button>
            <p style="color: #666; font-size: 12px; margin-top: 20px;">Contact admin for access credentials</p>
        </div>

        <!-- ADMIN CONTENT -->
        <div id="admin-content">
            <div class="header">
                <h2>STAFF HUB</h2>
                <button class="logout-btn" onclick="handleLogout()">LOG OUT</button>
            </div>

            <div class="dashboard-grid">
                <!-- CONVO BOARD -->
                <div class="staff-card">
                    <h3>💬 TEAM CHAT</h3>
                    <div id="chat-list" class="scroll-area"></div>
                    <div class="input-row">
                        <input type="text" id="chat-input" placeholder="Type a message...">
                        <button class="btn btn-gold" style="width: auto;" onclick="sendMsg()">SEND</button>
                    </div>
                </div>

                <!-- TO-DO BOARD -->
                <div class="staff-card">
                    <h3>✓ TASKS</h3>
                    <div id="todo-list" class="scroll-area"></div>
                    <div class="input-row">
                        <input type="text" id="todo-input" placeholder="Add a new task...">
                        <button class="btn btn-gold" style="width: auto;" onclick="addTodo()">ADD</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = window.SUPABASE_URL || 'https://your-supabase-url.supabase.co';
        const SUPABASE_KEY = window.SUPABASE_KEY || 'your-supabase-key';
        let _supabase;
        try {
            _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (err) {
            console.error('Supabase init failed.');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Mock data for demo
        let mockChat = [
            { sender: 'admin@bsf.org', text: 'Good morning team! Ready for today?' },
            { sender: 'staff@bsf.org', text: '✓ All vehicles inspected. 3 vehicles ready for pickup.' }
        ];

        let mockTodos = [
            { id: 1, task: 'Inspect new vehicle donations', is_done: true },
            { id: 2, task: 'Follow up with donors', is_done: false },
            { id: 3, task: 'Prep paperwork for Maria C.', is_done: false }
        ];

        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');

            if (!email || !password) {
                alert('Please enter email and password');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'LOGGING IN...';

            // Demo: accept demo credentials
            if (email === 'demo@bsf.org' && password === 'demo123') {
                checkUser();
            } else {
                alert('Invalid credentials. Try demo@bsf.org / demo123 for demo access.');
                btn.disabled = false;
                btn.innerText = 'ENTER PORTAL';
            }
        }

        async function handleLogout() {
            location.reload();
        }

        function checkUser() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            loadChat();
            loadTodos();
        }

        function loadChat() {
            const list = document.getElementById('chat-list');
            list.innerHTML = mockChat.map(m => `<div class="chat-msg"><span class="chat-user">${escapeHtml(m.sender.split('@')[0])}:</span> ${escapeHtml(m.text)}</div>`).join('');
            list.scrollTop = list.scrollHeight;
        }

        function sendMsg() {
            const text = document.getElementById('chat-input').value.trim();
            if (!text) return;
            mockChat.push({ sender: 'demo@bsf.org', text: text });
            document.getElementById('chat-input').value = '';
            loadChat();
        }

        function loadTodos() {
            const list = document.getElementById('todo-list');
            list.innerHTML = mockTodos.map(t => `
                <div class="todo-item">
                    <input type="checkbox" ${t.is_done ? 'checked' : ''} onchange="toggleTodo(${t.id}, this.checked)">
                    <span style="${t.is_done ? 'text-decoration: line-through; color: #555' : ''}">${escapeHtml(t.task)}</span>
                </div>
            `).join('');
        }

        function addTodo() {
            const task = document.getElementById('todo-input').value.trim();
            if (!task) return;
            mockTodos.push({ id: Date.now(), task: task, is_done: false });
            document.getElementById('todo-input').value = '';
            loadTodos();
        }

        function toggleTodo(id, is_done) {
            const todo = mockTodos.find(t => t.id === id);
            if (todo) todo.is_done = is_done;
            loadTodos();
        }
    </script>
</body>
</html>
